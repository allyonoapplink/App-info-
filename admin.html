<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel</title>
<style>body{font:14px system-ui;margin:0;padding:16px;background:#061c12;color:#fff}.box{max-width:900px;margin:0 auto 14px;padding:16px;background:#0b3020;border:1px solid #39704f;border-radius:16px}input,textarea{width:100%;box-sizing:border-box;padding:10px;margin:4px 0 10px;background:#03160d;color:#fff;border:1px solid #39704f;border-radius:9px}button{padding:10px 13px;margin:3px;border:0;border-radius:9px;background:#187747;color:#fff;font-weight:800}.gold{background:#c9980b;color:#170f00}.red{background:#9b302c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.status{padding:9px;background:#03160d;border-radius:9px;color:#b9d4c3}table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #29553e;text-align:left;font-size:12px}.thumb{width:44px;height:44px;object-fit:cover;border-radius:7px}.preview{width:100%;height:600px;background:#fff;border:1px solid #39704f;border-radius:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body>
<div class="box"><h1>Main Website Admin Panel</h1><div>GitHub repository control • browser-only • no server backend</div></div>
<div class="box"><h2>Username / Repository / Token</h2><div class="grid"><div>Owner<input id="owner"></div><div>Repository<input id="repo"></div><div>Branch<input id="branch" value="main"></div><div>Token<input id="token" type="password"></div></div><button class="gold" id="verify">Verify & Unlock</button><div id="status" class="status">Locked.</div></div>
<div class="box" id="controls" hidden><h2>Master Control</h2><button id="load">Load Repository</button><button class="gold" id="saveApps">Save Apps</button><button class="gold" id="saveIndex">Save Index HTML</button><button id="preview">Live Preview</button></div>
<div class="box" id="editor" hidden><h2>74 Apps — Edit / Remove / Recovery</h2><div class="grid"><div>ID<input id="id" type="number" min="1" max="74"></div><div>Name<input id="name"></div><div>Image URL<input id="image"></div><div>Link<input id="link"></div></div><button id="edit">Add / Replace</button><button class="red" id="remove">Remove</button><button id="recover">Recovery</button><table><thead><tr><th>ID</th><th>Image</th><th>Name</th><th>Edit</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="box" id="htmlbox" hidden><h2>Home / Details HTML Control</h2><textarea id="source" style="min-height:300px"></textarea></div>
<div class="box" id="previewbox" hidden><h2>Live Preview</h2><iframe id="frame" class="preview"></iframe></div>
<script>
const $=x=>document.getElementById(x),S={token:"",owner:"",repo:"",branch:"main",apps:[],backup:[],appSha:null,indexSha:null};
const enc=s=>btoa(unescape(encodeURIComponent(s))),dec=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
function msg(x){$("status").textContent=x}
function api(path,opt={}){return fetch("https://api.github.com/repos/"+encodeURIComponent(S.owner)+"/"+encodeURIComponent(S.repo)+"/contents/"+path+"?ref="+encodeURIComponent(S.branch),{...opt,headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+S.token,...(opt.headers||{})}})}
$("verify").onclick=async()=>{S.owner=$("owner").value.trim();S.repo=$("repo").value.trim();S.branch=$("branch").value.trim()||"main";S.token=$("token").value.trim();try{let r=await fetch("https://api.github.com/user",{headers:{Authorization:"Bearer "+S.token}});if(!r.ok)throw Error("Token verification failed: "+r.status);let u=await r.json();msg("Verified: "+u.login);$("controls").hidden=$("editor").hidden=$("htmlbox").hidden=false}catch(e){msg(e.message)}};
$("load").onclick=async()=>{try{let r=await api("apps.js");if(!r.ok)throw Error("apps.js: "+r.status);let d=await r.json();S.appSha=d.sha;let a=dec(d.content).match(/window\.APPS\s*=\s*([\s\S]*);/);if(!a)throw Error("apps.js format invalid");S.apps=JSON.parse(a[1]);S.backup=JSON.parse(JSON.stringify(S.apps));render();let ir=await api("index.html");if(ir.ok){let x=await ir.json();S.indexSha=x.sha;$("source").value=dec(x.content)}msg("Loaded "+S.apps.length+" app records.")}catch(e){msg(e.message)}};
function render(){$("rows").innerHTML=S.apps.map(a=>"<tr><td>"+a.id+"</td><td><img class=thumb src='"+a.image+"'></td><td>"+String(a.name).replaceAll("<","&lt;")+"</td><td><button onclick='pick("+a.id+")'>Edit</button></td></tr>").join("")}
window.pick=id=>{let a=S.apps.find(x=>x.id===id);$("id").value=a.id;$("name").value=a.name;$("image").value=a.image;$("link").value=a.link};
$("edit").onclick=()=>{let id=+$("id").value;if(id<1||id>74)return alert("ID 1-74");let a={id,name:$("name").value.trim(),image:$("image").value.trim(),link:$("link").value.trim()};let i=S.apps.findIndex(x=>x.id===id);if(i<0)S.apps.push(a);else S.apps[i]=a;S.apps.sort((a,b)=>a.id-b.id);render();msg("Changed locally; press Save Apps.")};
$("remove").onclick=()=>{let id=+$("id").value;if(confirm("Remove app "+id+"?")){S.apps=S.apps.filter(a=>a.id!==id);render();msg("Removed locally; press Save Apps.")}};
$("recover").onclick=()=>{S.apps=JSON.parse(JSON.stringify(S.backup));render();msg("Recovered last loaded copy.")};
async function put(path,text,sha,msgText){let r=await api(path,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:msgText,content:enc(text),sha,branch:S.branch})});if(!r.ok)throw Error("Save failed: "+r.status);return r.json()}
$("saveApps").onclick=async()=>{try{let d=await put("apps.js","window.APPS = "+JSON.stringify(S.apps,null,2)+";\n",S.appSha,"Update apps from Admin Panel");S.appSha=d.content.sha;S.backup=JSON.parse(JSON.stringify(S.apps));msg("apps.js published.")}catch(e){msg(e.message)}};
$("saveIndex").onclick=async()=>{try{let d=await put("index.html",$("source").value,S.indexSha,"Update index.html from Admin Panel");S.indexSha=d.content.sha;msg("index.html published.")}catch(e){msg(e.message)}};
$("preview").onclick=()=>{$("previewbox").hidden=false;$("frame").srcdoc=$("source").value;$("previewbox").scrollIntoView({behavior:"smooth"})};
</script></body></html>
